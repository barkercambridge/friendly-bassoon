name: Release
on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Choose Acceptance or Production before starting (cannot change during run)'
        required: true
        type: choice
        options:
          - Acceptance
          - Production
        default: Acceptance
permissions:
  contents: write
  actions: read
  pull-requests: write
jobs:
  verify-and-package:
    name: ${{ inputs.edition }}
    if: github.event_name == 'workflow_dispatch' && (inputs.edition == 'Acceptance' || inputs.edition == 'Production')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retrieve pinned central DevStan and Python defect register
        shell: pwsh
        env:
          STANDARDS_READ_TOKEN: ${{ secrets.STANDARDS_READ_TOKEN }}
        run: |
          python scripts/fetch-central-docs.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned central standards unavailable or invalid' }
      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rtm = Get-Content -LiteralPath 'config/traceability.json' -Raw | ConvertFrom-Json
          $version = [string]$rtm.version
          if ($version -notmatch '^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$') { throw 'Invalid version in config/traceability.json' }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Application version: $version"
      - name: Reuse successful main-push preflight for this exact commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          python scripts/reuse-preflight-evidence.py
          if ($LASTEXITCODE -ne 0) { throw 'A successful preflight for this exact release commit is required' }
      - name: Validate preflight evidence provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '${{ github.sha }}'
          $syntax = Get-Content -LiteralPath 'release-evidence/powershell-syntax.json' -Raw | ConvertFrom-Json
          $regression = Get-Content -LiteralPath 'release-evidence/regression-results.json' -Raw | ConvertFrom-Json
          if ($syntax.source_commit -cne $expected -or $regression.source_commit -cne $expected) { throw 'Preflight evidence commit does not match release commit' }
          if (@($syntax.scripts).Count -eq 0 -or @($syntax.scripts | Where-Object { $_.result -ne 'PASS' }).Count -gt 0) { throw 'PowerShell preflight evidence incomplete or failed' }
          $expected = @( (Get-Content -LiteralPath 'config/traceability.json' -Raw | ConvertFrom-Json).regression_suites )
          if (@($regression.tests).Count -ne $expected.Count -or @($regression.tests | Where-Object { $_.status -ne 'PASS' }).Count -gt 0) { throw 'Regression preflight evidence incomplete or failed' }
      - name: Regression-test Git source equivalence policy
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\\tests\\test-git-equivalence.ps1 -EvidenceDir 'release-evidence'
          if ($LASTEXITCODE -ne 0) { throw 'Git source equivalence regression tests failed' }
          $report = Get-Content -LiteralPath 'release-evidence/git-equivalence-regression.json' -Raw | ConvertFrom-Json
          if ($report.failed -ne 0 -or $report.passed -lt 12) { throw 'Git source equivalence regression evidence incomplete or failed' }
      - name: Generate and verify PDF formatting checks
        shell: pwsh
        run: |
          python -m pip install reportlab
          if ($LASTEXITCODE -ne 0) { throw 'PDF dependency installation failed' }
          python scripts/build-formatting-checks.py
          if ($LASTEXITCODE -ne 0) { throw 'PDF generation failed' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/test-format-checks-alignment.ps1 -Version '${{ steps.version.outputs.value }}'
          if ($LASTEXITCODE -ne 0) { throw 'PDF alignment failed' }
      - name: Generate release change summary PDF
        shell: pwsh
        run: |
          python scripts/build-release-notes.py
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath 'info/release.pdf')) { throw 'Release change PDF generation failed' }
      - name: Validate controlled document register
        shell: pwsh
        run: |
          python scripts/verify-document-register.py --verify-only
          if ($LASTEXITCODE -ne 0) { throw 'Document register validation failed' }
      - name: Verify Devstan FR and AT mappings before packaging
        shell: pwsh
        run: |
          python scripts/verify-devstan.py
          if ($LASTEXITCODE -ne 0) { throw 'Devstan verification failed' }
      - name: Clear previous Acceptance evidence in ephemeral checkout
        if: inputs.edition == 'Acceptance'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('tests/results/acceptance-results.json', 'tests/results/code-coverage.json', 'tests/results/coverage-diagnostics.json')) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Force -ErrorAction Stop
            }
            if (Test-Path -LiteralPath $path) { throw "Stale Acceptance evidence remains: $path" }
          }
          Write-Host 'Prior acceptance and coverage evidence excluded from this ephemeral build.'
      - name: Verify edition-specific acceptance evidence
        shell: pwsh
        run: |
          if ('${{ inputs.edition }}' -eq 'Acceptance') {
            python scripts/verify-documentation-evidence.py --acceptance-build
          } else {
            python scripts/verify-documentation-evidence.py --production
          }
          if ($LASTEXITCODE -ne 0) { throw 'Edition-specific acceptance evidence validation failed' }
      - name: Note Word acceptance tests require interactive desktop Word
        if: inputs.edition == 'Acceptance'
        shell: pwsh
        run: |
          $inventory = (Get-Content -LiteralPath 'config/traceability.json' -Raw | ConvertFrom-Json).acceptance_tests
          $required = @($inventory | Where-Object { $_.status -eq 'required' -and $_.stage -eq 'Acceptance' } | ForEach-Object { $_.id })
          Write-Host ("Required Acceptance tests not run on this GitHub-hosted runner: " + ($required -join ', '))
          Write-Host 'Use run-acceptance-tests.bat at the ZIP root on an interactive Windows desktop with Microsoft Word.'
          Write-Host 'This package is for acceptance testing, not production approval.'
      - name: Package acceptance-test distribution
        if: inputs.edition == 'Acceptance'
        shell: powershell
        run: |
          & .\scripts\package-release.ps1 -Version '${{ steps.version.outputs.value }}' -Commit '${{ github.sha }}' -Edition acceptance
          if (-not (Test-Path -LiteralPath "dist/virtual-admin-acceptance-v${{ steps.version.outputs.value }}.zip")) { throw 'Acceptance ZIP missing' }
          if (-not (Test-Path -LiteralPath "dist/virtual-admin-acceptance-v${{ steps.version.outputs.value }}.sha256")) { throw 'Acceptance checksum missing' }
      - name: Verify acceptance ZIP layout and info/ PDF register
        if: inputs.edition == 'Acceptance'
        shell: powershell
        run: |
          & .\\tests\\test-package-archive.ps1 -ArchivePath "dist/virtual-admin-acceptance-v${{ steps.version.outputs.value }}.zip" -Edition acceptance
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance release layout verification failed' }
      - name: Upload acceptance-test distribution
        if: inputs.edition == 'Acceptance'
        uses: actions/upload-artifact@v4
        with:
          name: virtual-admin-acceptance
          path: |
            dist/virtual-admin-acceptance-*.zip
            dist/virtual-admin-acceptance-*.sha256
          if-no-files-found: error
      - name: Publish acceptance GitHub prerelease
        if: inputs.edition == 'Acceptance'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_VERSION -notmatch '^[0-9]+[.][0-9]+$') { throw 'Invalid release version (expected MAJOR.MINOR)' }
          $rtm = Get-Content -LiteralPath 'config/traceability.json' -Raw | ConvertFrom-Json
          if ($rtm.version -ne $env:RELEASE_VERSION) { throw 'Version does not match config/traceability.json' }
          $tag = "acceptance-v$($env:RELEASE_VERSION)"
          $zip = "dist/virtual-admin-acceptance-v$($env:RELEASE_VERSION).zip"
          $checksum = "dist/virtual-admin-acceptance-v$($env:RELEASE_VERSION).sha256"
          foreach ($path in @($zip, $checksum)) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing acceptance asset: $path" }
          }
          $existing = & gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing to replace published assets" }
          $notes = @'
          Acceptance-testing distribution only. NOT approved for production.
          Required Acceptance tests listed in config/traceability.json have not been executed by this GitHub-hosted workflow.
          Run run-acceptance-tests.bat at the ZIP root on an interactive Windows computer with Microsoft Word installed.
          Devstan production checks may remain NOT VERIFIED; production publication is separately blocked.
          '@
          & gh release create $tag $zip $checksum --target $env:RELEASE_COMMIT --title "Virtual Admin Acceptance v$($env:RELEASE_VERSION)" --notes $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'GitHub acceptance prerelease publication failed' }
      - name: Verify acceptance release-input fingerprint independently
        if: inputs.edition == 'Production'
        shell: pwsh
        run: |
          python scripts/acceptance-evidence-freshness.py
          if ($LASTEXITCODE -ne 0) { throw 'Production blocked: acceptance evidence stale or invalid' }
      - name: Verify current acceptance JSON and tested-source equivalence
        if: inputs.edition == 'Production'
        shell: powershell
        run: |
          & .\scripts\verify-production-approval.ps1 -Version '${{ steps.version.outputs.value }}' -Commit '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance evidence or source equivalence failed' }
      - name: Compile production Excel test evidence
        if: inputs.edition == 'Production'
        shell: pwsh
        run: |
          python -m pip install openpyxl
          if ($LASTEXITCODE -ne 0) { throw 'Excel dependency installation failed' }
          python scripts/build-traceability.py --edition production
          if ($LASTEXITCODE -ne 0) { throw 'Production Excel evidence compilation failed' }
      - name: Generate production test reports from acceptance JSON
        if: inputs.edition == 'Production'
        shell: pwsh
        run: |
          python -m pip install reportlab
          if ($LASTEXITCODE -ne 0) { throw 'ReportLab installation failed' }
          python scripts/build-test-reports.py
          if ($LASTEXITCODE -ne 0) { throw 'Production test report generation failed' }
      - name: Package production-only files
        if: inputs.edition == 'Production'
        shell: powershell
        run: |
          & .\scripts\package-release.ps1 -Edition production -Version '${{ steps.version.outputs.value }}' -Commit '${{ github.sha }}'
          if (-not (Test-Path -LiteralPath "dist/virtual-admin-production-v${{ steps.version.outputs.value }}.zip")) { throw 'Production ZIP missing' }
          if (-not (Test-Path -LiteralPath "dist/virtual-admin-production-v${{ steps.version.outputs.value }}.sha256")) { throw 'Production checksum missing' }
      - name: Verify production ZIP layout and info/ PDF register
        if: inputs.edition == 'Production'
        shell: powershell
        run: |
          & .\\tests\\test-package-archive.ps1 -ArchivePath "dist/virtual-admin-production-v${{ steps.version.outputs.value }}.zip" -Edition production
          if ($LASTEXITCODE -ne 0) { throw 'Production release layout verification failed' }
      - name: Verify all mandatory Devstan production controls
        if: inputs.edition == 'Production'
        shell: pwsh
        run: |
          python scripts/verify-devstan.py --production
          if ($LASTEXITCODE -ne 0) { throw 'Devstan production verification incomplete or failed' }
      - name: Generate production evidence manifest and evidence manifest
        if: inputs.edition == 'Production'
        shell: pwsh
        run: |
          python scripts/verify-document-register.py --edition production
          if ($LASTEXITCODE -ne 0) { throw 'Production evidence manifest failed' }
      - name: Record automated production approval
        if: inputs.edition == 'Production'
        shell: pwsh
        run: |
          python scripts/record-production-approval.py
          if ($LASTEXITCODE -ne 0) { throw 'Automated approval was not recorded' }
      - name: Verify final production manifest after approval
        if: inputs.edition == 'Production'
        shell: pwsh
        run: |
          python scripts/verify-final-evidence-manifest.py
          if ($LASTEXITCODE -ne 0) { throw 'Final production manifest verification failed' }
      - name: Upload final production verification evidence
        if: always() && inputs.edition == 'Production'
        uses: actions/upload-artifact@v4
        with:
          name: virtual-admin-production-verification
          path: release-evidence/*
          if-no-files-found: warn
      - name: Publish approved production release
        if: inputs.edition == 'Production'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_VERSION -notmatch '^[0-9]+[.][0-9]+$') { throw 'Invalid release version' }
          $tag = "v$($env:RELEASE_VERSION)"
          $zip = "dist/virtual-admin-production-v$($env:RELEASE_VERSION).zip"
          $checksum = "dist/virtual-admin-production-v$($env:RELEASE_VERSION).sha256"
          $existing = & gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing overwrite" }
          & gh release create $tag $zip $checksum --target $env:RELEASE_COMMIT --title "Virtual Admin v$($env:RELEASE_VERSION)" --notes "Production release. Automated verification evidence recorded after all mandatory Devstan controls passed." --latest
          if ($LASTEXITCODE -ne 0) { throw 'Production release publication failed' }
      # Acceptance remains a prerelease; production requires verified acceptance and Devstan approval.
